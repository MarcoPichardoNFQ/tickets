# Lunes 06:07 UTC: informe semanal (el archivado es diario, archivo.yml).
name: Lunes - informe semanal
on:
  schedule:
    - cron: "7 6 * * 1"
  workflow_dispatch:
jobs:
  lunes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 05_GENERAL/Herramientas/informe_semanal.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A 05_GENERAL/Informes
          git diff --cached --quiet || git commit -m "lunes: informe semanal" && git push
